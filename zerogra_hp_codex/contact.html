<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONTACT | ZERO GRA WAVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./contact.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./index.html">ZERO GRA WAVE</a>
      <nav class="gnav" aria-label="グローバルナビゲーション">
        <a href="./index.html#concept">CONCEPT</a>
        <a href="./index.html#feature">FEATURE</a>
        <a href="./index.html#technology">TECHNOLOGY</a>
        <a href="./index.html#results">RESULTS</a>
        <a href="./index.html#flow">FLOW</a>
        <a href="./index.html#faq">FAQ</a>
        <a href="./index.html#sns">SNS</a>
      </nav>
      <div class="mobile-quick-links" aria-label="モバイルクイックリンク" style="display:none;">
        <a href="./index.html#faq">FAQ</a>
        <a href="./index.html#sns">SNS</a>
      </div>
      <a class="btn btn-sm" href="./contact.html">お問い合わせはこちら</a>
      <button class="menu-btn" aria-label="メニューを開く">☰</button>
    </div>
  </header>

  <main class="contact-page">
    <section class="contact-head">
      <h1>CONTACT</h1>
      <p class="subtitle">お問い合わせ</p>
      <p class="lead">
        サービス等に関するご質問やご不明な点はお気軽にお問い合わせください。<br />
        お問い合わせ内容の確認後、担当者よりご連絡をさせていただきます。
      </p>
    </section>

    <section class="contact-form-wrap">
      <form class="contact-form" action="https://formsubmit.co/info@zerograwave.com" method="POST">
        <input type="hidden" name="_subject" value="ZERO GRA WAVE お問い合わせ" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_next" value="https://zerogra.seren-group.jp/thanks.html" />
        <div class="form-group">
          <label for="company">御社名（サロン名）</label>
          <input id="company" name="company" type="text" placeholder="会社名" />
        </div>

        <div class="form-group">
          <label for="name">お名前</label>
          <input id="name" name="name" type="text" placeholder="山田 太郎" />
        </div>

        <div class="form-group">
          <label for="tel">電話番号</label>
          <input id="tel" name="tel" type="tel" placeholder="〇〇〇-〇〇〇〇-〇〇〇〇" />
        </div>

        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" placeholder="emai@example.com" />
        </div>

        <div class="form-group">
          <label for="message">お問い合わせメッセージ内容</label>
          <textarea id="message" name="message" placeholder="ここにテキストを入力"></textarea>
        </div>

        <div class="form-consent">
          <div class="check-row">
            <input id="agree-policy" name="agree_policy" type="checkbox" value="同意する" required />
            <label for="agree-policy">私は</label>
            <a class="policy-link" href="./privacy.html">利用規約（PRIVACY POLICY）</a>
            <span>に同意します。</span>
          </div>
        </div>

        <div class="robot-box">
          <label class="robot-check" for="not-robot">
            <input id="not-robot" name="not_robot" type="checkbox" value="確認済み" required />
            <span>私はロボットではありません</span>
          </label>
          <span class="robot-brand">reCAPTCHA</span>
        </div>

        <div class="form-actions">
          <button type="submit">送信する</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
